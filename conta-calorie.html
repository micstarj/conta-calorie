<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conta Calorie</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--ac:#1d7a4f;--on:#fff;--bd:#e4e4de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151513;--card:#201f1d;--tx:#f0efe9;--mu:#9a9992;--ac:#4cc38a;--on:#0d1f16;--bd:#33322e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151513;--card:#201f1d;--tx:#f0efe9;--mu:#9a9992;--ac:#4cc38a;--on:#0d1f16;--bd:#33322e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav b{text-transform:capitalize}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--on);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.x{padding:6px 10px;background:transparent;color:var(--mu);border:1px solid var(--bd)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none}
textarea{resize:vertical;min-height:56px}
.big{font-size:30px;font-weight:700}
.mu{color:var(--mu);font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.mrow{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.it{border-top:1px solid var(--bd);padding:10px 0}
.g,.per{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.g label{display:flex;align-items:center;gap:6px;flex:1}
.per label{flex:1 1 90px;font-size:12px;color:var(--mu)}
.per>span{width:100%;font-size:12px;color:var(--mu)}
.sub,.cf{font-size:13px;color:var(--mu);margin-top:4px}
.tt{font-weight:700;padding:10px 0}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.stat{min-height:20px;font-size:14px;color:var(--mu);margin:8px 0}
details{margin-bottom:12px}summary{cursor:pointer;color:var(--mu);font-size:14px}
.nr{display:grid;grid-template-columns:24px 1fr 76px 56px 36px;gap:6px;align-items:center;margin-top:8px}
.nr .x{padding:6px 0}
</style></head>
<body><main>
<h1>Conta Calorie</h1>
<div class="nav"><button class="ghost" id="prev" aria-label="Giorno precedente">‹</button><b id="dl"></b><button class="ghost" id="next" aria-label="Giorno successivo">›</button></div>
<div class="card" id="sum"></div>

<div class="card">
<h2 id="ht">Aggiungi pasto</h2>
<select id="lab"><option>Colazione</option><option>Pranzo</option><option>Cena</option><option>Spuntino</option></select>
<div style="height:8px"></div>
<input type="file" id="ph" accept="image/*">
<div style="height:8px"></div>
<textarea id="note" placeholder="Opzionale ma consigliato: scrivi i pesi che conosci (es. “pasta 100 g a crudo, olio 10 g”)"></textarea>
<div class="row"><button id="go">Analizza</button><button class="ghost" id="man">+ Manuale</button></div>
<div class="stat" id="st"></div>
<div id="draft"></div>
</div>

<div id="meals"></div>

<details><summary>Nutrienti e obiettivi (modificabili)</summary>
<div class="mu" style="margin-top:8px">Spunta cosa tracciare, cambia nome, obiettivo e unità, oppure aggiungi nutrienti tuoi.</div>
<div id="nl"></div>
<div class="row"><button class="ghost" id="addn">+ Aggiungi nutriente</button></div>
</details>

<p class="mu">Le stime da foto sono approssimative, soprattutto per i micronutrienti: indica i pesi nella nota e correggi i valori prima di salvare.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r=v=>Math.round(v), n=v=>isFinite(+v)?+v:0;
const fm=v=>v>=100?r(v):Math.round(v*10)/10;
function iso(d){return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
const DEF=[['k','Calorie','kcal',2800,1],['p','Proteine','g',135,1],['c','Carboidrati','g',400,1],['f','Grassi','g',80,1],['fi','Fibre','g',30,1],['zu','Zuccheri','g',50,0],['sa','Sale','g',5,0],['ca','Calcio','mg',1000,0],['fe','Ferro','mg',10,0],['po','Potassio','mg',3500,0],['mg','Magnesio','mg',400,0],['vc','Vitamina C','mg',90,0],['vd','Vitamina D','µg',15,0]];
let S={days:{},nut:DEF.map(([id,l,u,t,on])=>({id,l,u,t,on:!!on}))},date=iso(new Date()),draft=[],edit=null,busy=false;
try{const x=localStorage.getItem('cc2')||localStorage.getItem('cc1');if(x){const o=JSON.parse(x);
  if(o.nut)S.nut=o.nut;else if(o.t)S.nut.forEach(z=>{if(o.t[z.id]!=null)z.t=o.t[z.id]});
  S.days=o.days||{};
  for(const d in S.days)for(const m of S.days[d])for(const it of m.items)if(!it.v){it.v={k:it.k||0,p:it.p||0,c:it.c||0,f:it.f||0};delete it.k;delete it.p;delete it.c;delete it.f}
}}catch(e){}
const save=()=>{try{localStorage.setItem('cc2',JSON.stringify(S))}catch(e){}};
const on=()=>S.nut.filter(x=>x.on);
const tot=a=>{const s={};S.nut.forEach(x=>s[x.id]=0);a.forEach(i=>S.nut.forEach(x=>{s[x.id]+=n((i.v||{})[x.id])*n(i.g)/100}));return s};
const line=s=>on().map(x=>x.id==='k'?`${r(s.k)} kcal`:`${x.l} ${fm(s[x.id])} ${x.u}`).join(' · ');
const status=t=>{$('#st').textContent=t};

function render(){
  const meals=S.days[date]||[],T=tot(meals.flatMap(m=>m.items)),K=S.nut.find(x=>x.id==='k')||{t:0},left=K.t-T.k;
  $('#dl').textContent=new Date(date+'T12:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  $('#sum').innerHTML=`<div class="big">${r(T.k)} <span class="mu">/ ${fm(K.t)} kcal</span></div><div class="bar"><i style="width:${K.t>0?Math.min(100,T.k/K.t*100):0}%"></i></div><div class="mu" style="margin-bottom:10px">${left>=0?`Mancano ${r(left)} kcal`:`Superate di ${r(-left)} kcal`}</div>`+on().filter(x=>x.id!=='k').map(x=>`<div class="mrow"><span>${esc(x.l)}</span><span>${fm(T[x.id])} / ${fm(x.t)} ${esc(x.u)}</span></div><div class="bar"><i style="width:${x.t>0?Math.min(100,T[x.id]/x.t*100):0}%"></i></div>`).join('');
  $('#meals').innerHTML=meals.map((m,i)=>`<div class="card"><div class="mrow"><b>${esc(m.label)}</b><span><button class="x" data-e="${i}">Modifica</button> <button class="x" data-m="${i}" aria-label="Elimina pasto">×</button></span></div>${m.items.map(it=>`<div class="mu">${esc(it.nome)} · ${fm(n(it.g))} g</div>`).join('')}<div class="tt" style="padding-bottom:0;font-size:14px">${esc(line(tot(m.items)))}</div></div>`).join('');
}
function renderSet(){
  $('#nl').innerHTML=S.nut.map((x,i)=>`<div class="nr"><input type="checkbox" ${x.on?'checked':''} ${x.id==='k'?'disabled':''} data-n="${i}" aria-label="Traccia ${esc(x.l)}"><input value="${esc(x.l)}" data-n="${i}" data-f="l" aria-label="Nome"><input type="number" inputmode="decimal" value="${x.t}" data-n="${i}" data-f="t" aria-label="Obiettivo"><input value="${esc(x.u)}" data-n="${i}" data-f="u" aria-label="Unità">${x.id==='k'?'<span></span>':`<button class="x" data-nd="${i}" aria-label="Elimina nutriente">×</button>`}</div>`).join('');
}
function upd(){
  draft.forEach((it,i)=>{const e=$('#s'+i);if(e)e.textContent=line(tot([it]))});
  const e=$('#dt');if(e)e.textContent='Totale pasto: '+line(tot(draft));
}
function renderDraft(){
  const el=$('#draft');
  $('#ht').textContent=edit!=null?'Modifica pasto':'Aggiungi pasto';
  if(!draft.length){el.innerHTML='';return}
  el.innerHTML=draft.map((it,i)=>`<div class="it"><input value="${esc(it.nome)}" data-i="${i}" data-k="nome" aria-label="Nome alimento"><div class="g"><label>Grammi<input type="number" inputmode="decimal" value="${it.g}" data-i="${i}" data-k="g"></label><button class="x" data-del="${i}" aria-label="Rimuovi alimento">×</button></div><div class="per"><span>Valori per 100 g</span>${on().map(x=>`<label>${esc(x.l)} (${esc(x.u)})<input type="number" inputmode="decimal" value="${n((it.v||{})[x.id])}" data-i="${i}" data-v="${x.id}"></label>`).join('')}</div><div class="sub" id="s${i}"></div>${it.conf?`<div class="cf">Affidabilità della stima: ${esc(it.conf)}</div>`:''}</div>`).join('')+`<div class="tt" id="dt"></div><div class="row">${edit!=null?'<button class="ghost" id="cancel">Annulla</button>':''}<button id="commit">${edit!=null?'Salva modifiche':'Aggiungi al diario'}</button></div>`;
  upd();
}
$('#draft').addEventListener('input',e=>{
  const i=e.target.dataset.i;if(i==null)return;
  const it=draft[i];
  if(e.target.dataset.v){(it.v=it.v||{})[e.target.dataset.v]=n(e.target.value)}
  else if(e.target.dataset.k==='nome')it.nome=e.target.value;else it.g=n(e.target.value);
  upd();
});
$('#draft').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.del!=null){draft.splice(+b.dataset.del,1);renderDraft()}
  else if(b.id==='cancel'){draft=[];edit=null;status('');renderDraft()}
  else if(b.id==='commit'){
    if(!draft.length)return;
    const m={label:$('#lab').value,items:draft.map(i=>({nome:i.nome,g:n(i.g),v:Object.assign({},i.v)}))};
    const day=S.days[date]=S.days[date]||[];
    if(edit!=null)day[edit]=m;else day.push(m);
    save();draft=[];edit=null;$('#ph').value='';$('#note').value='';status('Pasto salvato.');renderDraft();render();
  }
});
$('#meals').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const day=S.days[date];
  if(b.dataset.m!=null){day.splice(+b.dataset.m,1);save();render()}
  else if(b.dataset.e!=null){
    const m=day[+b.dataset.e];draft=JSON.parse(JSON.stringify(m.items));edit=+b.dataset.e;
    $('#lab').value=m.label;status('Modifica i valori e salva.');renderDraft();$('#ht').scrollIntoView({behavior:'smooth'});
  }
});
$('#man').onclick=()=>{draft.push({nome:'Alimento',g:100,v:{}});renderDraft()};
$('#nl').addEventListener('input',e=>{
  const t=e.target,i=t.dataset.n,f=t.dataset.f;if(i==null||!f)return;
  S.nut[i][f]=f==='t'?n(t.value):t.value;save();render();
});
$('#nl').addEventListener('change',e=>{
  const t=e.target,i=t.dataset.n;if(i==null)return;
  if(t.type==='checkbox'){S.nut[i].on=t.checked;save();render()}
  renderDraft();
});
$('#nl').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.dataset.nd==null)return;
  S.nut.splice(+b.dataset.nd,1);save();renderSet();render();renderDraft();
});
$('#addn').onclick=()=>{S.nut.push({id:'x'+Date.now(),l:'Nuovo nutriente',u:'g',t:0,on:true});save();renderSet();render();renderDraft()};
const shift=d=>{const x=new Date(date+'T12:00');x.setDate(x.getDate()+d);date=iso(x);render()};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);

function shrink(f){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error('img'));
  fr.onload=()=>{const im=new Image();
    im.onerror=()=>rej(new Error('img'));
    im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.85)};
    im.src=fr.result};
  fr.readAsDataURL(f)})}

function prompt_(){
  const keys=on().map(x=>`"${x.id}" (${x.l}, ${x.u})`).join(', ');
  return `Sei un nutrizionista. Analizza il pasto (foto e/o testo). Per ogni alimento indica: nome in italiano; grammi stimati del peso nel piatto (nello stato in cui appare, cotto se cotto; usa piatto, posate e mani come riferimento di scala); in "valori" i valori per 100 g dello stesso stato per queste chiavi: ${keys}. Usa le tabelle CREA o USDA; "k" deve essere circa 4·P + 4·C + 9·G. Includi condimenti e oli visibili. Non inventare alimenti non visibili: se un ingrediente è incerto, confidenza bassa. Se non conosci un valore, metti 0. Rispondi SOLO con JSON valido: {"alimenti":[{"nome":"","grammi":0,"confidenza":"alta|media|bassa","valori":{}}],"nota":"una frase su cosa verificare"}`;
}
$('#go').onclick=async()=>{
  if(busy)return;
  const f=$('#ph').files[0],note=$('#note').value.trim();
  if(!f&&!note){status('Aggiungi una foto o una descrizione.');return}
  busy=true;$('#go').disabled=true;status('Analisi in corso…');
  try{
    const sample=await claude.use('sample');
    if(!sample){status('Analisi non disponibile qui: usa “+ Manuale”.');return}
    const opts={modelTier:'complex',cache:false};
    if(f){const l=await sample.limits();if(l&&l.images)opts.images=[await shrink(f)];else if(!note){status('Le foto non sono supportate qui: descrivi il pasto nella nota.');return}}
    const res=await sample.json(prompt_()+(note?`\n\nNote dell’utente (hanno priorità sulle stime, soprattutto i pesi): ${note}`:''),opts);
    const arr=(res&&res.alimenti)||[];
    draft=draft.concat(arr.map(a=>{const v={};on().forEach(x=>v[x.id]=n((a.valori||{})[x.id]));return{nome:String(a.nome||'Alimento'),g:r(n(a.grammi)),v,conf:a.confidenza||''}}));
    status(res&&res.nota?String(res.nota):'Controlla grammi e valori, poi aggiungi al diario.');
    renderDraft();
  }catch(e){
    status(e&&e.code==='not_granted'?'Permesso negato: puoi inserire gli alimenti a mano.':'Analisi non riuscita. Riprova o inserisci a mano.');
  }finally{busy=false;$('#go').disabled=false}
};
renderSet();render();
</script></body></html>
